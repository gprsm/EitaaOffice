limit_req_zone $binary_remote_addr zone=eitaa_bridge_public:10m rate=20r/s;

server {
    listen 80;
    server_name eitaa.farhangimaz.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name eitaa.farhangimaz.ir;

    ssl_certificate /etc/nginx/ssl-origin/eitaa.crt;
    ssl_certificate_key /etc/nginx/ssl-origin/eitaa.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128m;

    location / {
        limit_req zone=eitaa_bridge_public burst=80 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_request_buffering off;
    }
}

# Stable same-host gateway for the second application.  It is not exposed on
# any public interface and applies the same sanitized proxy contract.
server {
    listen 127.0.0.1:8876;
    server_name _;
    client_max_body_size 128m;

    location / {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host eitaa.farhangimaz.ir;
        proxy_set_header Origin https://eitaa.farhangimaz.ir;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
