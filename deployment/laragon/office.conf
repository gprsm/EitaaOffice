# Office Apache vhost for Laragon — friendly entry to the EitaaBridge
# office product on the private LAN.
#
# WHAT IT DOES: answers http://eitaaoffice.test/ (and any Host on port 80)
# with a permanent redirect to the product's authoritative origin
# http://192.168.1.2:8765 — the ONLY address the bridge accepts
# (trusted_lan_http contract, ADR: allowed_hosts is exact).
#
# WHY A REDIRECT, NOT A PROXY: the bridge contract pins Host/Origin to
# http://192.168.1.2:8765 and rejects forwarded headers. A redirect keeps
# the security contract intact while giving LAN users a short URL.
#
# INSTALL: copy this file to C:\laragon\etc\apache2\sites-enabled\office.conf
# then (re)start Apache from the Laragon tray menu.

<VirtualHost *:80>
    ServerName eitaaoffice.test
    ServerAlias *.eitaaoffice.test
    DocumentRoot "C:/laragon/www"

    <Directory "C:/laragon/www">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
        Require ip 192.168.1
    </Directory>

    Redirect permanent / http://192.168.1.2:8765/

    ErrorLog  "C:/laragon/etc/apache2/logs/office-error.log"
    CustomLog "C:/laragon/etc/apache2/logs/office-access.log" combined
</VirtualHost>
