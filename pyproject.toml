[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eitaa-bridge"
version = "0.7.0.dev31"
description = "Local-first Eitaa-to-WordPress desktop bridge with an explainable index workbench and private contact directory."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "Eitaa Unified Project"}]
dependencies = [
  "eitaa-core==0.6.0.dev19",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
eitaa-bridge = "eitaa_bridge.interfaces.cli:main"
eitaa-bridge-api = "eitaa_bridge.interfaces.http_api:main"
eitaa-bridge-windows-lan = "eitaa_bridge.interfaces.windows_lan:main"
eitaa-bridge-provider-worker = "eitaa_bridge.interfaces.provider_worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eitaa_bridge = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
