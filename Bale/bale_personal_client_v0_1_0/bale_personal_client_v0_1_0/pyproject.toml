[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bale-personal-client"
version = "0.1.0"
description = "Independent research-grade personal client framework for Bale Messenger"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<0.29",
  "websockets>=12,<17",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[project.scripts]
bale-client = "bale_personal_client.cli:main"
bale-lab = "bale_personal_client.lab:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
